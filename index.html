<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⚠️ Top Secret: Open Me</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0618;--bg2:#2a0f4d;--text:#fff;--muted:#c9b8ee;--neon:#ff3cac;--neon2:#42e8ff;--gold:#ffd23c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070312;--bg2:#220a40}}
:root[data-theme="dark"]{--bg:#070312;--bg2:#220a40}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Poppins',system-ui,sans-serif;background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg) 70%);color:var(--text);display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
.stage{display:none;width:100%;max-width:520px;padding:20px;position:relative;z-index:3}
.stage.on{display:block}
.warn{font-size:13px;letter-spacing:4px;color:var(--gold);font-weight:600;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.glitch{font-size:clamp(34px,10vw,56px);font-weight:800;margin:14px 0;line-height:1.1;text-shadow:2px 0 var(--neon),-2px 0 var(--neon2);animation:gl 2.2s infinite}
@keyframes gl{0%,90%,100%{transform:none}92%{transform:translate(-4px,2px) skew(6deg)}94%{transform:translate(4px,-2px) skew(-6deg)}96%{transform:translate(-2px,0)}}
.sub{color:var(--muted);margin:0 0 30px;min-height:24px}
button{font:inherit;font-weight:800;font-size:19px;border:0;border-radius:999px;padding:15px 34px;color:#fff;background:linear-gradient(90deg,var(--neon),#8a5cff);box-shadow:0 0 28px rgba(255,60,172,.6);cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.94)}
button.run{position:fixed;z-index:20;transition:left .25s,top .25s}
#count{font-size:min(46vw,220px);font-weight:800;color:var(--neon2);text-shadow:0 0 40px var(--neon2);animation:pulse .9s ease-out}
@keyframes pulse{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
.hb{font-size:clamp(22px,7vw,34px);font-weight:800;letter-spacing:3px}
.hb span,.big span{display:inline-block;animation:wave 1.4s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(-10px)}}
.big{font-size:clamp(46px,15vw,84px);font-weight:800;line-height:1;margin:6px 0 14px;background:linear-gradient(90deg,var(--gold),var(--neon),var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,60,172,.55))}
.big span{color:transparent}
.cake{font-size:84px;animation:wave 1.8s ease-in-out infinite}
#msg{min-height:120px;font-size:17px;line-height:1.7;margin:10px 0 18px}
#msg b{color:var(--gold)}
.from{color:var(--muted);font-weight:600;margin-top:10px}
.b{position:fixed;bottom:-80px;font-size:46px;z-index:1;animation:up linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-120vh) rotate(18deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="stage on" id="s1">
  <div class="warn">⚠ TOP SECRET ⚠</div>
  <div class="glitch">A message<br>just for YOU</div>
  <p class="sub" id="hint">Only the chosen one can open this…</p>
  <button id="open">Open it 🔓</button>
</div>

<div class="stage" id="s2"><div id="count"></div></div>

<div class="stage" id="s3">
  <div class="hb" id="hb"></div>
  <div class="big" id="big"></div>
  <div class="cake">🎂</div>
  <div id="msg"></div>
  <button id="blow" style="display:none">Make a wish &amp; blow the candles 🕯️</button>
  <div class="from" id="from"></div>
</div>

<script>
var NAME='My Beloved Noman';
var $=function(i){return document.getElementById(i)};
var cv=$('c'),cx=cv.getContext('2d'),P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function burst(n,x,y){
  var cl=['#ff3cac','#42e8ff','#ffd23c','#8a5cff','#3cff9e','#ff7a3c'];
  for(var i=0;i<(n||150);i++)P.push({x:x||cv.width/2,y:y||cv.height*.45,vx:(Math.random()-.5)*16,vy:Math.random()*-15-3,s:Math.random()*8+4,c:cl[i%6],r:Math.random()*6,g:.3});
}
(function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  P=P.filter(function(p){return p.y<cv.height+30});
  P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
  requestAnimationFrame(loop);
})();
function show(id){['s1','s2','s3'].forEach(function(s){$(s).classList.toggle('on',s===id)})}
function letters(el,t){el.innerHTML='';t.split('').forEach(function(ch,i){var s=document.createElement('span');s.textContent=ch===' '?'\u00a0':ch;s.style.animationDelay=(i*.08)+'s';el.appendChild(s)})}

var dodges=0,taunts=['Too slow 😏','Nope, try again! 🏃','Almost… 😈','Okay okay, you earned it 😂'];
$('open').onclick=function(){
  var b=this;
  if(dodges<3){
    b.classList.add('run');
    b.style.left=Math.random()*(innerWidth-190)+'px';
    b.style.top=(innerHeight*.35+Math.random()*innerHeight*.5)+'px';
    $('hint').textContent=taunts[dodges];
    dodges++;return;
  }
  b.classList.remove('run');b.style.display='none';
  $('hint').textContent=taunts[3];
  setTimeout(countdown,700);
};
function countdown(){
  show('s2');var n=3;
  (function t(){
    if(n===0){reveal();return}
    var c=$('count');c.style.animation='none';c.offsetWidth;c.style.animation='';c.textContent=n;n--;setTimeout(t,900);
  })();
}
function balloons(){
  var e=['🎈','🎉','🎊','🎁','⭐','💖'];
  setInterval(function(){
    var b=document.createElement('div');b.className='b';b.textContent=e[Math.floor(Math.random()*e.length)];
    b.style.left=Math.random()*92+'vw';b.style.animationDuration=(4+Math.random()*4)+'s';
    document.body.appendChild(b);setTimeout(function(){b.remove()},8500);
  },450);
}
function type(el,html,done){
  var i=0,tag=false,out='';
  (function s(){
    if(i>=html.length){if(done)done();return}
    var ch=html[i++];out+=ch;if(ch==='<')tag=true;if(ch==='>')tag=false;
    el.innerHTML=out;
    if(tag)return s();
    setTimeout(s,32);
  })();
}
function reveal(){
  show('s3');burst(220);setTimeout(burst,500);setTimeout(burst,1000);balloons();
  letters($('hb'),'HAPPY BIRTHDAY');letters($('big'),NAME+'!');
  var m='Hey <b>'+NAME+'</b> 👋 Today the whole universe is celebrating YOU. 🌍✨<br>Thanks for being the kind of friend everyone wishes they had. May this year bring you epic wins, big laughs &amp; zero stress. 🚀';
  type($('msg'),m,function(){$('blow').style.display='inline-block';$('from').textContent='— Your friend, Fahad 💙'});
}
$('blow').onclick=function(){
  this.style.display='none';burst(260);setTimeout(function(){burst(200,cv.width*.2,cv.height*.5)},300);setTimeout(function(){burst(200,cv.width*.8,cv.height*.5)},600);
  $('msg').innerHTML='✨ Wish locked in. It’s going to come true. ✨<br><b>Now go eat some cake! 🍰</b>';
};
</script>
</body>
</html>
